[project]
name = "valuation-models"
version = "0.1.0"
description = "Teaching models: three-statement, DCF, comps, LBO, and sum of the parts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "plotly>=5.18",
  "yfinance>=0.2.40",
  "PyYAML>=6.0",
  "ipywidgets>=8.1",
  "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jupyter>=1.0",
  "nbclient>=0.10",
  "ipykernel>=6.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
valuation = ["assets/*.js", "assets/*.css", "assets/*.html"]
